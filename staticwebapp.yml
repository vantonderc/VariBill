# .github/workflows/staticwebapp.yml
name: Deploy Blazor to Azure Static Web App

on:
  push:
    branches: [ main ]
    paths:
      - 'VariBillWebApp.Blazor/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Publish Blazor
      run: dotnet publish VariBillWebApp.Blazor/VariBillWebApp.Blazor.csproj -c Release -o ./publish/blazor

    - name: Deploy to Azure Static Web App
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        action: 'upload'
        app_location: './publish/blazor/wwwroot'
        output_location: ''